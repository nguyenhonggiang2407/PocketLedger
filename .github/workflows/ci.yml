name: Verify PocketLedger

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocketledger-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: warn
      - name: Build and start the non-root container
        run: |
          docker build -t pocketledger-check .
          docker run -d --name pocketledger-check -e APP_ORIGIN=https://pocketledger.example.test --mount type=volume,src=pocketledger-ci-data,dst=/app/data pocketledger-check
          for attempt in {1..30}; do
            if docker exec pocketledger-check node scripts/healthcheck.mjs; then break; fi
            sleep 1
          done
          docker exec pocketledger-check node scripts/healthcheck.mjs
          docker exec pocketledger-check node --input-type=module -e 'const r = await fetch("http://127.0.0.1:3002"); if (!r.ok || !(await r.text()).includes("PocketLedger")) process.exit(1)'
          docker exec -i pocketledger-check node --input-type=module - seed < scripts/container-smoke.mjs
          docker restart pocketledger-check
          for attempt in {1..30}; do
            if docker exec pocketledger-check node scripts/healthcheck.mjs; then break; fi
            sleep 1
          done
          docker exec pocketledger-check node scripts/healthcheck.mjs
          docker exec -i pocketledger-check node --input-type=module - check < scripts/container-smoke.mjs
      - name: Clean up containers
        if: always()
        run: |
          docker rm -f pocketledger-check || true
          docker volume rm pocketledger-ci-data || true
